<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header Editor C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ── Editor chrome ─────────────────────────────── */
  :root {
    --ui-bg: #f3f3f4;
    --ui-panel: #ffffff;
    --ui-line: #e4e4e7;
    --ui-text: #18181b;
    --ui-sub: #71717a;
    --ui-accent: #2563eb;
    --ui-accent-soft: #eff4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Pretendard, -apple-system, sans-serif;
    background: var(--ui-bg);
    color: var(--ui-text);
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
  }

  .editor {
    background: var(--ui-panel);
    border-right: 1px solid #e3e3e3;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  /* top bar — Figma "top" (17465:33199) */
  .topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; height: 57px; padding: 6px 12px 6px 24px;
    background: #fff; border-bottom: 1px solid rgba(51,62,76,.1);
  }
  .topbar h1 { margin: 0; font: 700 16px/24px Pretendard, sans-serif; color: #000; white-space: nowrap; }
  .topbar .divider { width: 1px; height: 20px; background: rgba(51,62,76,.16); margin: 0 4px 0 24px; }
  .text-btn {
    display: flex; align-items: center; gap: 4px; height: 40px; padding: 8px 12px 8px 8px; border-radius: 8px;
    border: 0; background: transparent; cursor: pointer; color: #000;
    font: 600 14px/20px Pretendard, sans-serif;
  }
  .text-btn { white-space: nowrap; flex: none; }
  .text-btn:hover { background: rgba(24,29,37,.06); }
  .text-btn:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 1px; }
  /* prototype-only: switch between the two overlap placements */
  /* colour-menu controls in the preview toolbar only show while the 컬러 depth is open */
  body:not([data-depth="depthColor"]) [data-in-color] { display: none !important; }
  /* prototype-only: compare the two ways of showing what is being edited */
  .version-switch { display: flex; gap: 2px; margin-left: 20px; padding: 3px; border-radius: 8px; background: #f1f2f4; }
  .version-switch button {
    border: 0; border-radius: 6px; padding: 6px 12px; background: transparent; cursor: pointer;
    font: 500 12.5px/1 Pretendard, sans-serif; color: var(--ui-sub); white-space: nowrap;
  }
  .version-switch button[aria-pressed="true"] { background: #1b4efe; color: #fff; }
  .version-switch button:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 1px; }
  .topbar .actions { margin-left: auto; display: flex; gap: 12px; padding-right: 2px; }
  .btn {
    width: 90px; height: 40px; border-radius: 4px; cursor: pointer;
    font: 500 14px/1 Inter, Pretendard, sans-serif;
  }
  .btn.secondary { background: #fff; color: #000; border: 1px solid #d8d8d8; }
  .btn.primary { background: #000; color: #fff; border: 1px solid #000; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  /* header design dialog */
  .design-dialog {
    width: min(640px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: 12px;
    box-shadow: 0 24px 64px rgba(0,0,0,.2); color: var(--ui-text);
  }
  .design-dialog::backdrop { background: rgba(15,14,13,.45); }
  .dlg-head { padding: 20px 24px 4px; }
  .dlg-head h2 { margin: 0; font: 700 16px/24px Pretendard, sans-serif; }
  .dlg-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--ui-sub); }
  .dlg-body { padding: 16px 24px 20px; max-height: 68vh; overflow-y: auto; }
  .set-group + .set-group { margin-top: 20px; }
  .set-group h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
  .dlg-body .sets { grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .dlg-body .set { padding: 10px; border-radius: 10px; }
  .dlg-body .set-thumb { height: 72px; border-radius: 6px; padding: 0 10px; gap: 5px; align-items: flex-start; padding-top: 12px; }
  .dlg-body .set-thumb.inset { padding: 8px; }
  .dlg-body .set-thumb.inset > div { height: 22px; flex: 1; }
  .dlg-body .set-thumb i { width: 14px; height: 4px; }
  .dlg-body .set-thumb b { width: 24px; height: 5px; top: 12px; }
  .dlg-body .set-thumb.inset b { top: 8px; }
  .dlg-body .set span { font-size: 12.5px; margin-top: 8px; color: var(--ui-text); font-weight: 600; }
  .dlg-body .set small { display: block; font-size: 11.5px; color: var(--ui-sub); margin-top: 2px; line-height: 1.4; white-space: normal; }
  .dlg-body .set[aria-pressed="true"] span { color: var(--ui-accent); }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 24px 20px; }


  .group { padding: 18px 20px; }
  .group[hidden] { display: none; }
  .color-tabs { position: sticky; top: 0; z-index: 6; display: grid; grid-template-columns: 1fr 1fr; background: var(--ui-panel); border-bottom: 1px solid var(--ui-line); }
  .color-tabs button {
    position: relative; height: 44px; padding: 0; border: 0; background: none; cursor: pointer;
    font: 500 13px/1 Pretendard, sans-serif; color: var(--ui-sub);
  }
  .color-tabs button:hover { color: var(--ui-text); }
  .color-tabs button[aria-selected="true"] { color: var(--ui-text); font-weight: 600; }
  .color-tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ui-text); }
  .color-tabs button:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: -2px; border-radius: 4px; }
  .group-title {
    font-size: 12px; font-weight: 600; margin: 0 0 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .hint { font-size: 11.5px; color: var(--ui-sub); line-height: 1.5; margin: 8px 0 0; }
  .hint.warn { color: #b45309; }
  .hint code { font-family: Inter, sans-serif; font-size: 10.5px; background: #f4f4f5; padding: 0 4px; border-radius: 3px; }
  .sub { margin-top: 14px; }
  .sub-label { font-size: 11.5px; color: var(--ui-sub); margin: 0 0 6px; }
  :root {
    --logo: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIcAAAAeCAYAAAAGjg2BAAAACXBIWXMAABYlAAAWJQFJUiTwAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAOdEVYdFNvZnR3YXJlAEZpZ21hnrGWYwAABeNJREFUeAHNW9t12zgQHe3J/7qDQBWsUkHgCqJUsHQFsSuwXMEqFZipIHEF4lZgpwKxgygVIBgRdCToDokXFd1zYCd4zBDAYF6AycTjhy3Ptny1paJA2L4bE49XPrZcUQFYOusBfktKgDC3aFp2jBK+S0X0lXC0b4gm+qBcbE2AkJg04fD53FMmHB0JG0qAMDfejCiBNtMKB8KjGRCSvygfyhZmkr1xAXxWppP8JC1ix2lHR8LCFNJQFkznkS4blS1bae9KCEcP3rhbmh6srv+jNPw70s4bWlE5LM+0JrngvXv2D8aMdQvo/GBLKxDStrwnfAJ3tsxns9nOb3AqW3vV32x5AnSUKxIfxrXl01AE7DdsaVhzMBpL95ri6KK59eC1eGdptjROR9lfW9A098cP9P3seB7iLXWCv6Dh+R/PXbBFmkYm4SQteKzBdnlFI+A+Ap8o/4C/y4Qj1lfYjNAL+lZTxudQATzqgW991XRJZsVJ8UehWVNBWF4r++sL4hO5icik1LY0oL6istDmQswL750tlf0na4gd6HLfr2uyz+EE5AU0lXLoDlEL9ZrCgUJLFrr/Qf0HKo97ExI+ngnOJKMDzvu3F+Rch3QXWJcFNxFEN0gQTRdq+31bR7cGQ/QEG8n8v9IFwc0faeVP/CNXOBSoe6FpsAvkj4A0QcM/nAZsQHtFeeBF97+ZQ+XUSGsqrEHdlf1OnSwcdjBLl/Kq+TR+o2mgQF1LI3AaQDIpPVDENBb2jqGlLurzcWtGHP5zwu4XH2Z0oBfRwsHOihMMJHF3NAGMnIFtaRwajfPC4Br0UbmbaHnwGjWg6dGUS7aVwHdQ988boTM7T+jk8IQ0ndpvVp8fY/MOIXAnH2XwdoH80Dyaw/9wXsby4Trt9VsS3twY3NjyTMdrpqib0ySHKQGsOfx1WkjCoSmcKKvnGiW+cuCEgj+YPWd0ykbNl6OhQRNywp5A355/Mtinsd/BAuI7o2xenqY4UAmAzn6uQ8oZN17AT4ne/b2UiaEu+7ciLBgtYXvuQ6OxwobUoO6qhH/g/LDPoOnSzMsRStytsICsbNnYiS7oPLgLSUeTC8k8NKij03yoDTmzKVjRqY+k6IIv5yTh4OTIHJR31GXWkFpWNL2AtNTdqYSaFPQtXwaGwailxOl2wncDmi7hcg5qZ8nn2I2czMZ09yJ8Z6A8Jmxb51QeNXUaI9S3kRZcmYhHSvT7wqqhTLA5s7zZvPgajc3rVCmAEChQ9/MNJeLA0fIvlfYhYKCjJd3KcqLIl2YV6fRKKfAUNc6RRUNlsKLu29RBXf/244b+DN6Dupdk4WC4k8ARi6++Q0PA75ZG7VcK4asOFToz/qgnFvtHQCUiMhc2s9l+9po04ZB9UgyY36aEQ4oSKH9THtYk3BhSGHKzmz6KPgJyWUmU46jo/EBruo/oSgjHW1CnKAPuhKLQTwf6CxrUMc02sCDBLHpTO5A9PRtc8FCBpqbvgKApjLj04GQN+m5Av9UAbc4xbMGY7VD0YORHPZoCwdGDQONK6L+JmdvBOF6/H2YcShgb1FfgvTDyY+s9jZyLtz4yQci+mXXaAyW6FA1nLZFJaSMzkbVQX1FBuIgwJJlXDKY7dGxK2OdRoMtDH6lKDulyRALZu2WnU8peFgnL2Fk13R2P9po4I7sWHESUtGoojq9018KmZU0FwebF8vpA5V7QsdZD68Lmf0HY+ezx4l7edTDlAU+1SVe9kplYgb5Loa+mSBjZtCgqNLeD8WPmRQljSuLk9XnJP01gPDhHqxicOWhAE7rPKWFSetRCfUWF4dT4n8   }
  /* 미디어 위 컬러: one row per tone — 배경 · 전경 colour, 밝은/어두운 로고 */
  .logo-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12px; }
  .logo-row > span { font-size: 12.5px; font-weight: 600; }
  .text-link { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .text-link:hover { color: var(--ui-text); }
  .tones { display: grid; grid-template-columns: 1fr 28px 28px auto; align-items: center; gap: 8px 10px; margin-top: 12px; }
  .tones.is-hidden { display: none; }
  /* the per-tone logo column is C안 only; A안 picks 로고 컬러 once below */
  .tones-head { display: contents; font-size: 11px; color: var(--ui-sub); }
  .tones-head span { text-align: center; }
  .tone-name { font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .swatch.has-blur::after { content: ""; position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--ui-accent); box-shadow: 0 0 0 1.5px #fff; }
  /* 밝은 로고 / 어두운 로고: compact segmented control */
  .seg.logo-seg { padding: 2px; flex: none; }
  .seg.logo-seg button { flex: none; padding: 5px 8px; font-size: 11.5px; white-space: nowrap; }
  .is-hidden { display: none !important; }

  /* header set thumbnails */
  .sets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .set {
    border: 1px solid var(--ui-line); border-radius: 8px; background: #fff;
    padding: 6px; cursor: pointer; text-align: left; font: inherit;
  }
  .set:disabled { cursor: not-allowed; opacity: .45; }
  .set[aria-pressed="true"] { border-color: var(--ui-accent); box-shadow: 0 0 0 1px var(--ui-accent); }
  .set-thumb {
    height: 26px; border-radius: 4px; background: #f4f4f5;
    display: flex; align-items: center; padding: 0 5px; gap: 3px; position: relative;
  }
  .set-thumb i { display: block; height: 3px; width: 8px; background: #a1a1aa; border-radius: 1px; }
  .set-thumb b { position: absolute; left: 50%; transform: translateX(-50%); width: 14px; height: 4px; background: #3f3f46; border-radius: 1px; }
  .set-thumb .r { margin-left: auto; }
  .set-thumb em { position: absolute; top: 0; bottom: 0; left: 0; background: #3f3f46; }
  .set-thumb em.drawer { width: 34%; }
  .set-thumb em.full { right: 0; }
  .set-thumb.inset { background: #d4d4d8; padding: 4px; }
  .set-thumb.inset > div { flex: 1; height: 100%; background: #fff; border-radius: 2px; display: flex; align-items: center; padding: 0 4px; gap: 3px; position: relative; }
  .set span { display: block; font-size: 11px; margin-top: 5px; color: var(--ui-sub); white-space: nowrap; }
  .set[aria-pressed="true"] span { color: var(--ui-accent); font-weight: 600; }

  /* switch */
  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px; background: #d4d4d8; transition: background .15s;
    pointer-events: none;
  }
  .switch span::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s;
  }
  .switch input:checked + span { background: var(--ui-accent); }
  .switch input:checked + span::after { transform: translateX(14px); }
  .switch input:focus-visible + span { outline: 2px solid var(--ui-accent); outline-offset: 2px; }

  /* segmented */
  .seg { display: flex; background: #f4f4f5; border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button {
    flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 7px 4px;
    font: inherit; font-size: 12px; color: var(--ui-sub); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .seg button:disabled { cursor: not-allowed; }
  .is-dimmed-ui { opacity: .4; }
  .is-dimmed-ui label, .is-dimmed-ui .switch input { cursor: not-allowed; }
  /* 겹쳤을 때 컬러: long labels size to their text and stay on one line */
  #onSeg button { flex: 1 1 auto; white-space: nowrap; padding: 7px 6px; gap: 4px; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ui-text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* custom colour fields */
  .custom { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .cfield { display: flex; align-items: center; gap: 10px; min-height: 32px; }
  .cfield .swatch { flex: none; }
  .cfield label { font-size: 12px; line-height: 1.3; display: flex; align-items: center; gap: 6px; }
  .cfield .tag { white-space: nowrap; font: 500 10.5px/1 Inter, sans-serif; color: var(--ui-sub); background: #f4f4f5; border-radius: 4px; padding: 3px 5px; }
  .cgroup { margin: 2px 0 2px; font-size: 11.5px; font-weight: 600; color: var(--ui-sub); display: flex; align-items: center; gap: 6px; }
  /* inset divider between the 헤더·메뉴 and 검색 groups */
  .cdivider[hidden] { display: none; }
  .cdivider { height: 1px; background: var(--ui-line); margin: 10px 0 8px; border: 0; }
  .checker {
    background-image: linear-gradient(45deg, #e4e4e7 25%, transparent 25%, transparent 75%, #e4e4e7 75%), linear-gradient(45deg, #e4e4e7 25%, transparent 25%, transparent 75%, #e4e4e7 75%);
    background-size: 8px 8px; background-position: 0 0, 4px 4px; background-color: #fff;
  }
  .swatch {
    position: relative; width: 28px; height: 28px; border-radius: 6px; overflow: hidden; padding: 0; cursor: pointer;
    border: 1px solid var(--ui-line);
  }
  .swatch i { position: absolute; inset: 0; background: var(--v); pointer-events: none; }
  .swatch[aria-expanded="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ui-accent); }
  .swatch:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }

  /* colour picker — Figma menu/color/custom (6870:297859) */
  .cpick {
    position: fixed; z-index: 50; width: 238px; padding: 1px; background: #fff;
    border: 1px solid rgba(51,62,76,.1); border-radius: 12px; box-shadow: 0 4px 10px rgba(65,78,97,.08), 0 12px 32px rgba(65,78,97,.12);
    font-family: Pretendard, sans-serif;
  }
  .cpick[hidden] { display: none; }
  .cp-sv { position: relative; height: 172px; margin: 16px; border-radius: 4px; cursor: crosshair; touch-action: none;
    background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent), hsl(var(--h) 100% 50%); }
  .cp-handle {
    position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 1px 1px rgba(65,78,97,.08), 0 2px 8px rgba(65,78,97,.16); pointer-events: none; background: var(--c);
  }
  .cp-track { position: relative; height: 8px; margin: 0 16px; border-radius: 9999px; cursor: pointer; touch-action: none; }
  .cp-track .cp-handle { top: 4px; }
  .cp-hue { margin-top: 4px; background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .cp-alpha { margin-top: 20px; }
  .cp-alpha::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(to right, transparent, var(--solid)); }
  .cp-input { display: flex; align-items: center; gap: 8px; padding: 20px 16px 16px; }
  .cp-input > span { font: 500 12px/18px Pretendard, sans-serif; color: #333e4c; }
  .cp-field { flex: 1; display: flex; align-items: center; min-width: 0; background: #f6f7f9; border-radius: 6px; }
  .cp-field label { display: flex; align-items: center; gap: 2px; padding: 8px; font: 400 12px/18px Pretendard, sans-serif; color: #99a0aa; }
  .cp-field label:first-child { flex: 1; min-width: 0; }
  .cp-field label + label { border-left: 1px solid rgba(51,62,76,.1); padding-left: 10px; }
  .cp-field input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font: inherit; color: #333e4c; text-transform: uppercase; }
  .cp-field input.pct { width: 26px; text-align: right; }
  .cp-field input[aria-invalid="true"] { color: #dc2626; }
  .cp-blur { padding: 0 16px 16px; border-top: 1px solid rgba(51,62,76,.08); margin-top: -2px; padding-top: 14px; }
  .cp-blur[hidden] { display: none; }
  .cp-blur-head { display: flex; align-items: center; justify-content: space-between; font: 500 12px/18px Pretendard, sans-serif; color: #333e4c; }
  .cp-blur-head label { white-space: nowrap; cursor: pointer; }
  .cp-blur-row { margin-top: 10px; display: flex; align-items: center; gap: 10px; font: 500 12px/18px Pretendard, sans-serif; color: #333e4c; }
  .cp-blur-row[hidden] { display: none; }
  .cp-blur-row input[type="range"] { flex: 1; min-width: 0; accent-color: #1b4efe; }
  .cp-blur-row output { flex: none; width: 34px; text-align: right; font: 400 12px/18px Inter, sans-serif; color: #333e4c; }
  .cp-blur p { margin: 6px 0 0; font-size: 11px; line-height: 1.5; color: #99a0aa; }

  .group-divider { height: 1px; margin: 18px -20px 0; border: 0; background: var(--ui-line); }
  .group-desc { margin: 4px 0 12px; }
  .on-sub { margin: 18px 0 0; color: var(--ui-text); font-weight: 600; }
  /* 헤더 · 메뉴 · 검색: one row each; rows outside the type's range aren't shown */
  .surfaces { display: flex; flex-direction: column; gap: 8px; }
  .surface-row { display: flex; align-items: center; gap: 8px; min-height: 36px; }
  .surface-name { width: 34px; flex: none; font-size: 12.5px; font-weight: 600; }
  /* scheme picker: each option shows its colours — 배경, 글자, 호버 */
  .aa {
    position: relative; flex: none; width: 26px; height: 26px; border-radius: 6px; overflow: hidden;
    display: flex; justify-content: center; background: var(--b); color: var(--c);
    font: 600 11px/20px Inter, sans-serif; font-style: normal; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .aa::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 5px; height: 2px; border-radius: 1px; background: var(--u); }
  .aa[hidden] { display: flex; visibility: hidden; } /* list: keeps the names aligned */
  .scheme-btn .aa[hidden] { display: none; }
  .scheme-btn:has(.aa[hidden]) { padding-left: 11px; }
  .scheme-pick { position: relative; flex: 1; min-width: 0; }
  .scheme-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; height: 38px; padding: 0 10px 0 6px; cursor: pointer;
    border: 1px solid var(--ui-line); border-radius: 8px; background: #fff;
    font: 500 12.5px/1 Pretendard, sans-serif; color: var(--ui-text);
  }

  /* 헤더 표시 popover — Figma 6870:297330 */

  /* editor depth 1: menu list — Figma 17548:102762 */
  .menu-list { list-style: none; margin: 0; padding: 30px 24px; display: flex; flex-direction: column; gap: 8px; }
  .menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; padding: 0 16px 0 10px;

  /* editor depth 2 */
  .depth-head { display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 16px 0 12px; border-bottom: 1px solid var(--ui-line); }
  .depth-head h2 { margin: 0; font: 700 15px/1.5 Pretendard, sans-serif; }
  .back-btn {

  .tools-right { display: flex; align-items: center; gap: 16px; margin-left: auto; }

  }

  /* one-time tooltip announcing the toggle */
  .coach {
    position: absolute; bottom: calc(100% + 10px); right: 12px; z-index: 20; width: 260px;
    background: #18181b; color: #fff; border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,.24);

    animation: coach-in .2s ease-out;
  }

  .coach::before {
    content: ""; position: absolute; bottom: -5px; right: 18px; width: 10px; height: 10px;
    background: inherit; transform: rotate(45deg); border-radius: 2px;
  }
  .coach p { margin: 0; font-size: 12px; line-height: 1.5; }
  .coach-close {
    align-self: flex-end; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer;
    background: #fff; color: #18181b; font: 600 11.5px/1 Pretendard, sans-serif;
  }
  @keyframes coach-in { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .coach { animation: none; } }
  .previews { display: flex; gap: 24px; align-items: flex-start; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pane.desktop, .pane.mobile { flex: none; }

  .m .scroller, .m-menu { scrollbar-width: none; }

  /* ── 컬러 항목: one row per token, grouped like the Figma table ── */

  /* ── Storefront: Set 01 (desktop) + mobile A · B · F ────────── */
  /* colour tokens (--header-*, --header-menu-*, --header-search-*, --header-backdrop) are set inline */
  .frame { --hdr-h: 64px; --pad-x: 19px; }
  .frame.m { --hdr-h: 52px; --pad-x: 16px; }
  .hdr { position: sticky; top: 0; z-index: 3; font: 400 13px/1.2 Inter, sans-serif; }
  .hdr-bar {
    position: relative; z-index: 3;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: var(--hdr-h); padding: 0 var(--pad-x);
    background: var(--header-background); color: var(--header-nav);
    -webkit-backdrop-filter: blur(var(--header-blur, 0px)); backdrop-filter: blur(var(--header-blur, 0px));
    transition: background-color .25s ease, color .25s ease;
  }
  /* logo inlined as data URI: file:// pages block CSS masks loaded from disk */
  .hdr-logo {
    flex: none; width: 67.5px; height: 15px; background: var(--logo-color);
    -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
  }
  .hdr-item {
    position: relative; display: flex; align-items: center; height: 100%; padding: 0 8px;
    color: inherit; text-decoration: none; white-space: nowrap; cursor: pointer;
    border: 0; background: none; font: inherit;
  }
  /* no hover colour token: the same colour, underlined */
  .hdr-item:hover > span, .hdr-item.is-open > span { text-decoration: underline; text-underline-offset: 2px; }

  /* set01_header: logo left, menu centred, utility right */
  .d-nav { position: absolute; left: 50%; top: 0; height: 100%; transform: translateX(-50%); display: flex; gap: 12px; }
  .d-util { display: flex; gap: 12px; height: 100%; margin-right: -8px; }
  .d-close { display: none; }
  .hdr.is-search .d-nav, .hdr.is-search .d-util { display: none; }
  .hdr.is-search .d-close { display: flex; margin-right: -8px; }

  /* set01 2depth: a dropdown card under the item, behind it the page is dimmed */
  .dd {
    position: absolute; left: 0; top: 100%; min-width: 132px; padding: 8px 0 12px;
    background: var(--header-background); color: var(--header-menu-nav);
    display: flex; flex-direction: column; align-items: flex-start;
    opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s, background-color .25s ease;
  }
  .dd a { padding: 6px 16px 6px 8px; color: inherit; text-decoration: none; text-transform: capitalize; }
  .dd a:hover { text-decoration: underline; text-underline-offset: 2px; }
  .hdr.is-open .dd { opacity: 1; visibility: visible; transition: opacity .2s ease, visibility 0s, background-color .25s ease; }
  .dim {
    position: absolute; left: 0; right: 0; bottom: 0; top: var(--hdr-h); z-index: 2; background: var(--header-backdrop);
    -webkit-backdrop-filter: blur(var(--backdrop-blur, 0px)); backdrop-filter: blur(var(--backdrop-blur, 0px));
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .frame.is-dimmed .dim { opacity: 1; }

  /* search field — shared by desktop and mobile */
  .sf {
    display: flex; align-items: center; gap: 8px; padding: 13px 0 14px;
    border-bottom: 1px solid var(--header-search-border-inactive); transition: border-color .2s ease;
  }
  .sf.is-active { border-bottom-color: var(--header-search-border-active); }
  .sf-icon { flex: none; width: 16px; height: 16px; color: var(--header-search-icon); }
  .sf-box { position: relative; flex: 1; min-width: 0; }

    width: 100%; border: 0; outline: 0; padding: 0; background: transparent;

  .sf-mirror { position: absolute; inset: 0; display: none; align-items: center; pointer-events: none; font: 400 13px/1.2 Inter, Pretendard, sans-serif; }
  .sf-mirror b { visibility: hidden; font-weight: 400; white-space: pre; }

  .sf.show-caret .sf-mirror { display: flex; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sf-mirror i { animation: none; } }
  .res-head { display: flex; align-items: center; justify-content: space-between; }
  .res-label { color: var(--header-search-result-label); }
  .res-link { color: var(--header-search-result-link); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  /* set01_searchBar + set01_searchResult: covers the page under the header */
  .d-search {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 2; height: calc(1080px - var(--hdr-h));
    padding: 36px var(--pad-x) 40px; overflow-y: auto; scrollbar-width: none;
    background: var(--header-background); opacity: 0; visibility: hidden;
    transition: opacity .2s ease, visibility 0s linear .2s, background-color .25s ease;

  .hdr.is-search .d-search { opacity: 1; visibility: visible; transition: opacity .2s ease, visibility 0s, background-color .25s ease; }
  .d-search .res { margin-top: 48px; }

  .d-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 28px; }

  .d-grid .ph.p2 { background: #c9c9c9; } .d-grid .ph.p3 { background: #bdbdbd; } .d-grid .ph.p4 { background: #2b2b2b; }
  .d-grid .nm { margin-top: 14px; color: var(--header-search-product-name); }
  .d-grid .pr { margin-top: 6px; font-weight: 600; color: var(--header-search-product-price); }
  .d-grid .pr s { margin-left: 4px; font-weight: 400; color: var(--header-search-product-price-original); }

  /* ── mobile 390 × 844 · A / B / F pairings ── */
  .m-screen { position: relative; height: 844px; overflow: hidden; }
  .mb {
    display: flex; align-items: center; justify-content: center; height: 100%; min-width: 24px; padding: 0;
    border: 0; background: none; color: inherit; font: inherit; cursor: pointer; white-space: nowrap; text-decoration: none;

  .m .hdr-logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

  /* which buttons each pairing shows */
  .frame:not([data-pair="A"]) .only-a, .frame:not([data-pair="B"]) .only-b, .frame:not([data-pair="F"]) .only-f,
  .frame:not([data-pair="I"]) .only-i, .frame:not([data-pair="B"]):not([data-pair="I"]) .only-bi,
  .frame:not([data-pair="F"]):not([data-pair="I"]) .only-fi,
  .frame[data-pair="A"] .not-a { display: none !important; }
  .mb-close { display: none; }
  .frame[data-pair="B"] .m-left { display: none; }
  .m .hdr.is-menu .mb-open { display: none; }
  .m .hdr.is-menu .m-left .mb-close { display: flex; }
  /* B: an open panel keeps only the close button on the right */
  .frame[data-pair="B"] .hdr.is-menu .hdr-logo, .frame[data-pair="B"] .hdr.is-menu .m-right > :not(.mb-close) { display: none; }
  .frame[data-pair="B"] .hdr.is-menu .m-right .mb-close { display: flex; }
  /* F: search keeps only the close button on the right */
  .frame[data-pair="F"] .hdr.is-search .m-left, .frame[data-pair="F"] .hdr.is-search .hdr-logo,
  .frame[data-pair="F"] .hdr.is-search .m-right > :not(.mb-close) { display: none; }

  .frame:is([data-pair="B"], [data-pair="F"]) .hdr.is-menu .hdr-bar { justify-content: flex-end; }
  .frame[data-pair="F"] .hdr.is-menu:not(.is-search) .hdr-bar { justify-content: space-between; }

  .m-panel {
    position: absolute; left: 0; right: 0; top: 100%; height: calc(844px - var(--hdr-h)); z-index: 2;
    display: flex; flex-direction: column; padding: 0 16px 24px; overflow-y: auto; scrollbar-width: none;
    background: var(--header-background); color: var(--header-menu-nav);
    opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s, background-color .25s ease;
  }
  .hdr.is-menu .m-panel { opacity: 1; visibility: visible; transition: opacity .2s ease, visibility 0s, background-color .25s ease; }
  .m-panel .sf { padding-top: 16px; }
  .m-res { margin-top: 28px; }
  .m-res ul { margin: 18px 0 0; padding: 0; list-style: none; color: var(--header-search-result); }
  .m-res li { padding: 9px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .m-item {
    display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 0;
    border: 0; background: none; color: inherit; font: inherit; text-align: left; text-transform: capitalize; cursor: pointer;
  }
  .m-item svg { width: 14px; height: 14px; flex: none; }
  .m-list { margin-top: 12px; }
  .m-back { color: var(--header-menu-back); justify-content: flex-start; gap: 6px; }
  .acc-ico { color: var(--header-menu-expand-icon); }
  .acc-sub { display: none; padding: 0 0 8px 12px; }

  .m-util { color: var(--header-menu-utility); }
  .m-util .m-item { padding: 10px 0; }
  .m-panel > .m-util { margin-top: auto; }
  .frame[data-pair="F"] .m-panel > .m-util { margin-top: 64px; }
  /* what each pairing shows in the panel */
  .m-panel:not(.is-search-mode) .m-res, .m-panel.is-search-mode .m-list, .m-panel.is-search-mode .m-util,
  .frame[data-pair="A"] .m-res, .frame:not([data-pair="A"]) .m-panel:not(.is-search-mode) .sf { display: none; }
  .m-panel[data-depth="1"] .depth2, .m-panel[data-depth="2"] .depth1 { display: none; }

  /* the page starts under the header; the hero fills the rest of the first screen */
  .hero { height: calc(100cqh - var(--hdr-h)); }

  /* heroSection/fullBleed_center */
  .hero {
    position: relative; height: 100cqh; min-height: 560px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    padding: 96px 0;
  }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.2); }
  .hero[data-tone="light"] .hero-overlay { background: transparent; }
  .hero-content { position: relative; width: min(1200px, 90%); text-align: center; color: #fff; display: flex; flex-direction: column; gap: 12px; }
  .hero-content p { margin: 0; font-family: Pretendard, sans-serif; font-size: 14px; line-height: 20px; text-transform: capitalize; }
  .hero-content h2 { margin: 0; font-family: Inter, sans-serif; font-weight: 600; font-size: 48px; line-height: 58px; letter-spacing: -0.2px; text-transform: capitalize; }
  .hero-dots { display: none; }
  .m .hero { min-height: 0; padding: 72px 20px; }
  .m .hero-content { width: 100%; gap: 8px; }
  .m .hero-content h2 { font-weight: 700; font-size: 40px; line-height: 50px; text-transform: none; }
  .m .hero-dots { position: absolute; left: 64px; right: 64px; bottom: 24px; display: flex; gap: 8px; justify-content: center; }
  .m .hero-dots i { flex: 1; max-width: 40px; height: 2px; background: rgba(255,255,255,.4); }
  .m .hero-dots i:first-child { background: #fff; }

  /* filler sections */
  .section { padding: 64px 19px; font-family: Inter, sans-serif; color: #111; }
  .section h3 { font-size: 13px; font-weight: 500; margin: 0 0 20px; }
  .crumb { font-size: 12px; color: #6b6b6b; margin-bottom: 8px; }
  .title { font-size: 28px; font-weight: 500; margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card .ph { aspect-ratio: 3 / 4; background: #ddd; }
  .card .t { font-size: 13px; margin-top: 10px; }
  .card .p { font-size: 13px; color: #6b6b6b; margin-top: 4px; }
  .band { background: #f2f1ee; padding: 96px 19px; text-align: center; font-family: Inter, sans-serif; font-size: 22px; color: #111; }
  .m .section { padding: 40px 16px; }
  .m .title { font-size: 22px; margin-bottom: 20px; }
  .m .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .m .band { padding: 64px 16px; font-size: 18px; }

  /* ── Set 05 / 06: the header can sit over the hero (header-on-media) ── */
  .frame.is-overlap .hdr { margin-bottom: calc(-1 * var(--hdr-h)); }
  .hdr.on-media .hdr-bar {
    background: var(--header-on-media-background); color: var(--header-on-media-nav);
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  /* set05_header: menu left, logo centred, utility right */
  .frame[data-desk="05"] .hdr-logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .frame[data-desk="05"] .d-nav { position: static; transform: none; margin-left: -8px; gap: 4px; }
  .frame[data-desk="05"] .d-util { margin-left: auto; }
  /* set05_expanded: a full-width panel under the header */
  .frame[data-desk="05"] .hdr-item[data-dd] { position: static; }
  .frame[data-desk="05"] .dd { right: 0; padding: 12px var(--pad-x) 28px; }
  .frame[data-desk="05"] .dd a { padding: 7px 0; }
  /* set05_searchBar + set05_searchResult: the header stays, a panel opens under it and the page is dimmed */
  .frame[data-desk="05"] .hdr.is-search .d-nav, .frame[data-desk="05"] .hdr.is-search .d-util { display: flex; }
  .frame[data-desk="05"] .hdr.is-search .d-close { display: none; }
  .frame[data-desk="05"] .hdr.is-search [data-search] > span { text-decoration: underline; text-underline-offset: 2px; }
  .frame[data-desk="05"] .d-search { height: auto; padding: 20px var(--pad-x) 32px; }
  .frame[data-desk="05"] .d-search .res { margin-top: 28px; }
  .frame[data-desk="05"] .res-link, .frame[data-desk="05"] .d-grid { display: none; }
  .d-list { display: none; margin: 14px 0 0; padding: 0; list-style: none; color: var(--header-search-result); }
  .d-list li { padding: 6px 0; }
  .frame[data-desk="05"] .d-list { display: block; }

  /* mobileI: hamburger left, logo centred, search · bag right; the menu is a drawer over a dimmed page */
  .m-dim {
    position: absolute; left: 0; top: 0; width: 100%; height: 844px; z-index: 4; background: var(--header-backdrop);
    -webkit-backdrop-filter: blur(var(--backdrop-blur, 0px)); backdrop-filter: blur(var(--backdrop-blur, 0px));
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }

  .frame[data-pair="I"] .m-panel:not(.is-search-mode) { top: 0; right: auto; width: 330px; height: 844px; z-index: 5; padding-top: 0; }
  .m-dhead { display: flex; align-items: center; height: var(--hdr-h); color: var(--header-nav); flex: none; }
  .m-panel.is-search-mode .m-dhead { display: none !important; }

  .frame[data-pair="I"] .hdr.is-menu:not(.is-search) .mb-close { display: none; }
  .frame[data-pair="I"] .hdr.is-search .m-left, .frame[data-pair="I"] .hdr.is-search .hdr-logo,
  .frame[data-pair="I"] .hdr.is-search .m-right > :not(.mb-close) { display: none; }

</style>

const ITEMS = [

  background: { on: 'blurOn', px: 'blur', label: '배경 블러', hint: '배경 불투명도를 100% 미만으로 낮추면 헤더 뒤 콘텐츠가 흐리게 비쳐 보여요.' },

const DEFAULT_COLORS = {

function tokenVars() {
  const c = state.colors;
  const vars = { '--logo-color': state.logo === 'light' ? '#ffffff' : '#1a1a1a', '--header-blur': (c.blurOn ? c.blur : 0) + 'px', '--backdrop-blur': (c.backdropBlurOn ? c.backdropBlur : 0) + 'px' };
  for (const item of Object.values(ITEM)) vars['--' + item.token.replace('/default', '').replace('/', '-')] = c[item.key];
  return vars;
}

const PAGES = {
  'home-dark':  { fullBleed: true,  hero: { src: 'assets/hero-dark.jpg',  tone: 'dark',  sub: 'Less, but better', title: 'Crafted for Better Experience' } },
  'home-light': { fullBleed: true,  hero: { src: 'assets/hero-snow.jpg', tone: 'light', sub: '', title: '' } },
  'sub':        { fullBleed: false },
};

function cards(n) {
  return Array.from({ length: n }, (_, i) =>
    `<div class="card"><div class="ph"></div><div class="t">Product name ${i + 1}</div><div class="p">₩ 128,000</div></div>`).join('');
}

function pageHTML(key) {
  const p = PAGES[key];
  const hero = p.hero ? `
    <section class="hero" data-tone="${p.hero.tone}">
      <img src="${p.hero.src}" alt="">
      <div class="hero-overlay"></div>
      ${p.hero.title ? `<div class="hero-content"><p>${p.hero.sub}</p><h2>${p.hero.title}</h2></div>` : ''}
      <div class="hero-dots"><i></i><i></i><i></i><i></i><i></i></div>
    </section>` : `
    <section class="section">
      <div class="crumb">Home / Shop</div>
      <h1 class="title">New Arrivals</h1>
      <div class="grid">${cards(8)}</div>
    </section>`;
  return `${hero}
    <section class="section"><h3>New Arrivals</h3><div class="grid">${cards(4)}</div></section>
    <div class="band">Less, but better.</div>
    <section class="section"><h3>Best Sellers</h3><div class="grid">${cards(8)}</div></section>`;
}


/* shared pane plumbing: colour tokens, page content, the search field */
function basePane(node, width, height) {
  const frame = node.querySelector('.frame');
  const viewport = node.querySelector('.viewport');
  const scroller = node.querySelector('.scroller');
  const hdr = node.querySelector('.hdr');
  const page = node.querySelector('.page');
  viewport.style.setProperty('--vw', width + 'px');
  new ResizeObserver(() => {
    const scale = frame.clientWidth / width;
    viewport.style.height = (height || frame.clientHeight / scale) + 'px';
    viewport.style.transform = `scale(${scale})`;
  }).observe(frame);

  const host = node.querySelector('[data-sf-host]');
  host.prepend(document.getElementById('sfTpl').content.firstElementChild.cloneNode(true));
  const sf = host.querySelector('.sf');
  const input = sf.querySelector('input');
  input.placeholder = '검색어를 입력하세요';

  return {
    frame, scroller, hdr, page, host, input,
    paint() {
      frame.dataset.pair = state.set;
      frame.dataset.desk = state.desk;
      frame.classList.toggle('is-overlap', overlaps());
      for (const [k, v] of Object.entries(tokenVars())) frame.style.setProperty(k, v);
    },
    // typing state: focus line, results, and a drawn cursor while a colour is being edited
    paintSearch(caret) {
      const typed = !!input.value.trim();
      sf.classList.toggle('is-active', typed || document.activeElement === input);
      host.classList.toggle('is-empty', !typed);
      sf.querySelector('.sf-mirror b').textContent = input.value;
      sf.classList.toggle('show-caret', caret);
    },
  };
}

/* ── Desktop: set01_header / set05_header — hover Shop for the dropdown, click Search for the search screen ── */
function createDesktop() {
  const node = document.getElementById('desktopTpl').content.firstElementChild.cloneNode(true);
  const p = basePane(node, DESKTOP_W, DESKTOP_H);
  const { frame, scroller, hdr, page, input } = p;
  // solid: a header colour is being edited, so an overlapping header shows its hover / scroll look
  const local = { open: false, search: false, forced: false, caret: false, scrolled: false, hover: false, solid: false };
  const shop = hdr.querySelector('[data-dd]');

  function render() {
    p.paint();
    hdr.classList.toggle('is-open', local.open && !local.search);
    shop.classList.toggle('is-open', local.open && !local.search);
    hdr.classList.toggle('is-search', local.search);
    // Set 05 / 06 also dims the page under its search panel
    frame.classList.toggle('is-dimmed', (local.open && !local.search) || (local.search && state.desk === '05'));
    hdr.classList.toggle('on-media', overlaps() && !local.scrolled && !local.hover && !local.solid && !local.open && !local.search);
    p.paintSearch(local.caret);
  }
  // any real interaction ends an auto-shown state; hovering doesn't while the colour picker is open
  function clearForced() {
    if (!local.forced) return;
    local.forced = false; local.caret = false;
    viewReleased();
  }
  frame.addEventListener('pointerdown', clearForced, true);
  hdr.addEventListener('mouseenter', () => { local.hover = true; if (cp.el.hidden) clearForced(); render(); });
  shop.addEventListener('mouseenter', () => { if (!local.search && !local.forced) { local.open = true; render(); } });
  hdr.querySelectorAll('.d-nav > :not([data-dd]), .d-util .hdr-item').forEach(el =>
    el.addEventListener('mouseenter', () => { if (!local.forced && local.open) { local.open = false; render(); } }));
  hdr.addEventListener('mouseleave', () => { local.hover = false; if (!local.forced && local.open) local.open = false; render(); });

  function setSearch(open) {
    local.search = open; local.open = false; local.caret = false;
    if (open) setTimeout(() => input.focus({ preventScroll: true }), 50);
    else input.value = '';
    render();
  }
  // Set 01 swaps the menu for a Close button; Set 05 / 06 keeps it, so Search closes again
  hdr.querySelector('[data-search]').addEventListener('click', () => setSearch(state.desk === '05' ? !local.search : true));
  hdr.querySelector('[data-close]').addEventListener('click', () => setSearch(false));
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', render);
  input.addEventListener('keydown', e => { if (e.key === 'Escape') setSearch(false); });
  scroller.addEventListener('scroll', () => {
    const scrolled = scroller.scrollTop > 0;
    if (scrolled !== local.scrolled) { local.scrolled = scrolled; render(); }
  }, { passive: true });

  return {
    node, render,
    setPage() { page.innerHTML = pageHTML(state.page); scroller.scrollTop = 0; render(); },
    setView(view, opts = {}) {
      Object.assign(local, { open: false, search: false, forced: view === 'menu' || view === 'search', caret: false, solid: !!opts.solid });
      scroller.scrollTop = view === 'scroll' ? SCROLL_Y : 0;
      local.scrolled = scroller.scrollTop > 0;
      if (view === 'menu') local.open = true;
      if (view === 'search') { local.search = true; local.caret = !opts.empty; }
      input.value = view === 'search' && !opts.empty ? 'Product' : '';
      render();
    },
  };
}

/* ── Mobile: mobileA / mobileB / mobileF / mobileI header and expanded panel ── */
function createMobile() {
  const node = document.getElementById('mobileTpl').content.firstElementChild.cloneNode(true);
  const p = basePane(node, MOBILE_W, MOBILE_H);
  const { frame, scroller, hdr, page, host: panel, input } = p;
  const local = { menu: false, search: false, depth: 1, expand: null, caret: false, scrolled: false, solid: false };

  function render() {
    p.paint();
    hdr.classList.toggle('is-menu', local.menu);
    // I's drawer leaves the header bar as it was, under the dim
    const covered = local.menu && (local.search || state.set !== 'I');
    hdr.classList.toggle('on-media', overlaps() && !local.scrolled && !local.solid && !covered);
    hdr.classList.toggle('is-search', local.menu && local.search);
    panel.classList.toggle('is-search-mode', local.search && state.set !== 'A'); // A searches inside the menu panel
    panel.dataset.depth = local.depth;
    panel.querySelectorAll('.acc').forEach(a => a.classList.toggle('is-open', a.dataset.acc === local.expand));
    p.paintSearch(local.caret);
  }
  function setMenu(open, search = false) {
    Object.assign(local, { menu: open, search: open && search, depth: 1, expand: null, caret: false });
    if (!open || !search) input.value = '';
    render();
  }
  node.querySelectorAll('[data-menu]').forEach(b => b.addEventListener('click', () => { setMenu(true); viewReleased(); }));
  node.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { setMenu(false); viewReleased(); }));
  node.querySelectorAll('[data-msearch]').forEach(b => b.addEventListener('click', () => { setMenu(true, true); viewReleased(); }));
  panel.querySelector('[data-to2]').addEventListener('click', () => { local.depth = 2; render(); });
  panel.querySelector('[data-to1]').addEventListener('click', () => { local.depth = 1; render(); });
  panel.querySelectorAll('[data-acc-toggle]').forEach(b => b.addEventListener('click', () => {
    const k = b.closest('.acc').dataset.acc;
    local.expand = local.expand === k ? null : k; render();
  }));
  input.addEventListener('input', () => { local.caret = false; render(); });
  input.addEventListener('focus', render);
  input.addEventListener('blur', render);
  scroller.addEventListener('scroll', () => {
    const scrolled = scroller.scrollTop > 0;
    if (scrolled !== local.scrolled) { local.scrolled = scrolled; render(); }
  }, { passive: true });

  return {
    node, render,
    setPage() { page.innerHTML = pageHTML(state.page); scroller.scrollTop = 0; setMenu(false); },
    setView(view, opts = {}) {
      scroller.scrollTop = view === 'scroll' ? SCROLL_Y : 0;
      local.scrolled = scroller.scrollTop > 0;
      local.solid = !!opts.solid;
      // A has no separate search screen: its search field sits at the top of the menu panel
      setMenu(view === 'menu' || view === 'search', view === 'search' && state.set !== 'A');
      if (view === 'menu') { local.depth = opts.depth2 ? 2 : 1; local.expand = opts.expand ? 'shop' : null; }
      if (view === 'search') { input.value = opts.empty ? '' : 'Product'; local.caret = !opts.empty; }
      render();
    },
  };
}

/* ── Stage: desktop 1920 × 1080 and mobile 390 × 844, scaled to one shared height that fits ── */
const SCROLL_Y = 400;
const stage = document.getElementById('stage');
const stageInner = document.getElementById('stageInner');
const previews = document.getElementById('previews');
const panes = [createDesktop(), createMobile()];
panes.forEach(p => previews.appendChild(p.node));
new ResizeObserver(() => {
  const cs = getComputedStyle(stage);
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
    - stageInner.querySelector('.stage-tools').offsetHeight - (parseFloat(getComputedStyle(stageInner).rowGap) || 0);
  const gap = parseFloat(getComputedStyle(previews).columnGap) || 0;
  const ratios = [DESKTOP_W / DESKTOP_H, MOBILE_W / MOBILE_H];
  const h = Math.max(120, Math.floor(Math.min(availH, (availW - gap) / (ratios[0] + ratios[1]))));
  let total = gap;
  panes.forEach((p, i) => {
    const w = Math.floor(h * ratios[i]);
    total += w;
    p.node.style.width = w + 'px';
    p.node.querySelector('.frame').style.height = h + 'px';
  });
  stageInner.style.width = total + 'px';
}).observe(stage);

function renderAll() { panes.forEach(p => p.render()); }
function setPageAll() { panes.forEach(p => { p.setPage(); p.setView(state.view); }); }

// preview state, driven by "컬러 수정 중인 화면 자동 보기"
function setView(view, opts) {
  state.view = view;
  panes.forEach(p => p.setView(view, opts));
}
// user interaction inside a preview ends a forced state
function viewReleased() {
  if (state.view === 'default' || state.view === 'scroll') return;
  state.view = 'default';
}

// show the screen where the item's colour is used
function autoShow(key) {
  const item = ITEM[key];
  // C2 never changes the screen: it only shows the item's detail state on the screen already picked
  if (state.mode === 'screens') { if (item.opts && item.view === state.screen) setView(state.screen, item.opts); return; }
  if (!document.getElementById('autoShow').checked) return;

}

/* ── colour picker (HSV + alpha), opened from a swatch ── */
const cp = {
  el: document.getElementById('cpick'), key: null, obj: null, h: 0, s: 0, v: 0, a: 1, // obj: state.colors
  sv: document.getElementById('cpSV'), hue: document.getElementById('cpHue'), alpha: document.getElementById('cpAlpha'),
  hex: document.getElementById('cpHex'), pct: document.getElementById('cpPct'),
};
const clamp = (n, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, n));
function hexToRgba(hex) {
  let h = hex.slice(1);
  if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = i => parseInt(h.slice(i, i + 2), 16);
  return { r: n(0), g: n(2), b: n(4), a: h.length === 8 ? n(6) / 255 : 1 };
}
function rgbToHsv({ r, g, b }) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  let h = 0;
  if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: (h * 60 + 360) % 360, s: max ? d / max : 0, v: max };
}
function hsvToRgb(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return Math.round((v - v * s * Math.max(0, Math.min(k, 4 - k, 1))) * 255); };
  return { r: f(5), g: f(3), b: f(1) };
}
const hx = n => n.toString(16).padStart(2, '0');
const cpRgbHex = () => { const { r, g, b } = hsvToRgb(cp.h, cp.s, cp.v); return '#' + hx(r) + hx(g) + hx(b); };
const cpValue = () => cpRgbHex() + (cp.a < 1 ? hx(Math.round(cp.a * 255)) : '');

function cpPaint(skip) {
  const solid = cpRgbHex();
  cp.el.style.setProperty('--h', cp.h);
  cp.el.style.setProperty('--solid', solid);
  const svh = document.getElementById('cpSVh');
  svh.style.left = cp.s * 100 + '%'; svh.style.top = (1 - cp.v) * 100 + '%'; svh.style.setProperty('--c', solid);
  const hh = document.getElementById('cpHueh');
  hh.style.left = cp.h / 360 * 100 + '%'; hh.style.setProperty('--c', `hsl(${cp.h} 100% 50%)`);
  const ah = document.getElementById('cpAlphah');
  ah.style.left = cp.a * 100 + '%'; ah.style.setProperty('--c', solid);
  if (skip !== cp.hex) { cp.hex.value = solid.slice(1).toUpperCase(); cp.hex.removeAttribute('aria-invalid'); }
  if (skip !== cp.pct) cp.pct.value = Math.round(cp.a * 100);
  const blur = document.getElementById('cpBlur');
  const bk = BLUR[cp.key];
  blur.hidden = !bk;
  if (bk) {
    const on = !!cp.obj[bk.on], v = cp.obj[bk.px] || 8;
    document.querySelector('label[for="cpBlurOn"]').textContent = bk.label;
    document.getElementById('cpBlurHint').textContent = bk.hint;
    document.getElementById('cpBlurOn').checked = on;
    document.getElementById('cpBlurAmount').hidden = !on;
    document.getElementById('cpBlurRange').value = v;
    document.getElementById('cpBlurOut').textContent = v + 'px';
  }
}
function cpCommit(skip) {
  cp.obj[cp.key] = cpValue();
  cpPaint(skip); syncEditor(); renderAll();
}
function openPicker(key, btn) {
  if (cp.key === key && !cp.el.hidden) return closePicker();
  closePicker();
  cp.key = key; cp.obj = state.colors;
  const rgba = hexToRgba(cp.obj[key]);
  Object.assign(cp, rgbToHsv(rgba), { a: rgba.a });
  btn.setAttribute('aria-expanded', 'true');
  cp.el.hidden = false;
  cpPaint();
  // open just right of the editor panel, level with the swatch, so the other rows stay visible
  const r = btn.getBoundingClientRect(), h = cp.el.offsetHeight;
  cp.el.style.left = (document.querySelector('.editor').getBoundingClientRect().right + 8) + 'px';
  cp.el.style.top = clamp(r.top - 12, 8, innerHeight - h - 8) + 'px';
  autoShow(key);
}
function closePicker() {
  if (cp.el.hidden) return;
  cp.el.hidden = true;
  document.querySelectorAll('.swatch[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  cp.key = null; cp.obj = null;
}
function dragOn(el, onMove) {
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    const move = ev => { const r = el.getBoundingClientRect(); onMove(clamp((ev.clientX - r.left) / r.width), clamp((ev.clientY - r.top) / r.height)); };
    move(e);
    el.onpointermove = move;
    el.onpointerup = () => { el.onpointermove = null; };
  });
}
dragOn(cp.sv, (x, y) => { cp.s = x; cp.v = 1 - y; cpCommit(); });
dragOn(cp.hue, x => { cp.h = x * 360; cpCommit(); });
dragOn(cp.alpha, x => { cp.a = Math.round(x * 100) / 100; cpCommit(); });
cp.hex.addEventListener('input', () => {
  const v = cp.hex.value.trim().replace(/^#/, '');
  const ok = /^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v);
  cp.hex.setAttribute('aria-invalid', String(!ok));
  if (!ok) return;
  Object.assign(cp, rgbToHsv(hexToRgba('#' + v)));
  cpCommit(cp.hex);
});
cp.pct.addEventListener('input', () => {
  const n = parseInt(cp.pct.value, 10);
  if (Number.isNaN(n)) return;
  cp.a = clamp(n / 100);
  cpCommit(cp.pct);
});
cp.pct.addEventListener('blur', () => cpPaint());
cp.hex.addEventListener('blur', () => cpPaint());
document.getElementById('cpBlurOn').addEventListener('change', e => {
  cp.obj[BLUR[cp.key].on] = e.target.checked;
  cpPaint(); syncEditor(); renderAll();
});
document.getElementById('cpBlurRange').addEventListener('input', e => {
  cp.obj[BLUR[cp.key].px] = +e.target.value;
  cpPaint(); syncEditor(); renderAll();
});
document.addEventListener('pointerdown', e => {
  if (!cp.el.hidden && !cp.el.contains(e.target) && !e.target.closest('.swatch')) closePicker();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
document.querySelector('.editor').addEventListener('scroll', closePicker);


itemsEl.addEventListener('click', e => {
  const sw = e.target.closest('.swatch');
  if (sw) openPicker(sw.closest('.citem').dataset.key, sw);
});

function syncEditor() {
  const key = pairKey(), c = state.colors;
  itemsEl.querySelectorAll('.citem').forEach(row => {
    const item = ITEM[row.dataset.key], on = item.on[key];
    row.hidden = !on || (state.mode === 'screens' && !onScreen(item, state.screen));
    row.querySelector('label').firstChild.textContent = (item.labelBy && item.labelBy[state.set]) || item.label;
    row.querySelector('.swatch i').style.setProperty('--v', c[row.dataset.key]);
    const dev = row.querySelector('.dev');
    dev.hidden = !on || on === 'both';
    dev.textContent = DEV_LABEL[on] || '';
  });
  // a group with nothing to edit for this pairing goes too
  itemsEl.querySelectorAll('.item-group').forEach(g => { g.hidden = !g.querySelector('.citem:not([hidden])'); });
  // the 검색창 / 검색 결과 line only while both sides have items
  itemsEl.querySelectorAll('.cdivider').forEach(hr => {
    const has = dir => { for (let el = hr[dir]; el; el = el[dir]) if (!el.hidden) return true; return false; };
    hr.hidden = !has('previousElementSibling') || !has('nextElementSibling');
  });
  const screens = state.mode === 'screens';
  document.getElementById('itemsNote').textContent = (screens
    ? '미리보기 위에서 화면을 고르면 그 화면에 쓰이는 컬러만 보여요.'
    : '항목을 누르면 그 컬러가 쓰이는 화면을 미리보기에서 보여줘요.') + ' PC · 모바일 표시가 있는 항목은 그 기기에만 적용돼요.';
  document.getElementById('autoShowWrap').hidden = screens;
  document.getElementById('screenSeg').hidden = !screens;
  document.querySelectorAll('#screenSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.screen === state.screen)));
  document.querySelectorAll('.version-switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  for (const [key, bk] of Object.entries(BLUR)) {
    const tag = itemsEl.querySelector(`[data-key="${key}"] .tag`);
    tag.hidden = !c[bk.on];
    tag.textContent = `블러 ${c[bk.px]}`;
  }
  document.querySelectorAll('#logoSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.logo === state.logo)));
}

document.getElementById('logoSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  state.logo = b.dataset.logo;
  closePicker(); syncEditor(); renderAll();
});

});
setsEl.addEventListener('dblclick', e => { if (e.target.closest('.set')) dialog.close('apply'); });
document.getElementById('openDesigns').addEventListener('click', () => {
  pendingSet = pairKey(); syncPending(); dialog.showModal();
});
dialog.addEventListener('close', () => {
  if (dialog.returnValue !== 'apply' || pendingSet === pairKey()) return;
  state.desk = pendingSet.slice(0, 2); state.set = pendingSet.slice(2);
  closePicker(); syncEditor();
  setView(state.mode === 'screens' ? state.screen : 'default');
});
// backdrop click closes without applying
dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close('cancel'); });

/* ── prototype: C1 자동 보기 · C2 화면별 보기 ── */
document.querySelector('.version-switch').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.mode === state.mode) return;
  state.mode = b.dataset.mode;
  closePicker(); dismissCoach(); syncEditor();
  setView(state.mode === 'screens' ? state.screen : 'default');
});
document.getElementById('screenSeg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  state.screen = b.dataset.screen;
  closePicker(); syncEditor();
  setView(state.screen);
});

document.getElementById('page').addEventListener('change', e => {
  state.page = e.target.value;
  setPageAll();
});

/* ── Editor depths: menu list → 컬러 (others are placeholders) ── */
function openDepth(id, title) {
  document.querySelectorAll('.editor .depth').forEach(d => d.classList.toggle('is-hidden', d.id !== id));
  document.body.dataset.depth = id;
  if (title) document.getElementById('otherTitle').textContent = title;
  document.querySelector('.editor').scrollTop = 0;
}
document.querySelectorAll('.menu-item').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.depth === 'color') { openDepth('depthColor'); if (state.mode === 'auto') showCoach(); }
  else openDepth('depthOther', b.querySelector('span').textContent);
}));
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => {
  dismissCoach(); closePicker();
  openDepth('depthRoot');
}));

syncEditor();
setPageAll();
</script>
</body>
</html>
